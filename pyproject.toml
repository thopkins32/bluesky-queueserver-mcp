[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-queueserver-mcp"
version = "0.1.0"
description = "MCP server for Bluesky Queue Server (bluesky-queueserver)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "fastmcp",
    "bluesky-queueserver-api",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bluesky_queueserver_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10"

[tool.pixi.pypi-dependencies]
bluesky-queueserver-mcp = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
serve = "python -m bluesky_queueserver_mcp"
serve-http = { cmd = "python -m bluesky_queueserver_mcp", env = { QSERVER_MCP_TRANSPORT = "http" } }

[tool.pixi.feature.test.tasks]
test = "pytest"
